# Server Configuration
server.port=8080

# Database Configuration
# The database file will be created in a 'data' directory at the root of the WeddingWebsite project.
spring.datasource.url=jdbc:sqlite:data/wedding.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA and Hibernate Configuration
# Using a community dialect for SQLite with modern Hibernate versions.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# We use 'validate' because Flyway will manage the schema.
spring.jpa.hibernate.ddl-auto=validate

# Flyway Configuration
spring.flyway.locations=classpath:db/migration
flyway.cleanDisabled=false

# Session Configuration
server.servlet.session.cookie.name=wed_sess


